version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      production-dependencies:
        dependency-type: production
        update-types: ["minor", "patch"]
      development-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint does not support TypeScript 7 yet. Lifting this needs
      # a matching eslint-config-next release, so take major TS bumps manually.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint majors need eslint-config-next support first.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Next.js and React majors are upgrade events, not drive-by bumps.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
