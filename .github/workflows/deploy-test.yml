name: Deploy to Test

on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy test environment
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      # Run database migrations against the TEST database here once Prisma is
      # wired up, for example:
      #   npx prisma migrate deploy
      # Keep this step before `vercel build` so a failed migration aborts the
      # deploy instead of shipping code that expects a missing column.

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Smoke test
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for attempt in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' "$url")"
            echo "Attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Smoke test failed for $url"
          exit 1
